 var decoys=shuffle(POSTS.filter(function(p){return S.seen.indexOf(p.id)<0})).slice(0,2);S.pool=shuffle(seenPosts.concat(decoys));go('pause')}
function resetReflect(){S.step='write';S.text='';S.word='';S.more=false;S.core=null;S.nuance=null;S.level=3;S.worth=null;S.nudge=false;S.crisis=false;S.q=(S.q+1)%QUESTIONS.length}

/* ---------- pause: reflect ---------- */
function pause(){if(!S.pause)return today();if(S.crisis)return crisis();if(S.backoff)return backoff();if(S.pause.mode==='recall')return recall();if(S.step==='name')return name();if(S.step==='done')return done();
 var p=S.pause.last,full=P.perm==='full';
 return '<section class="screen between" style="padding-top:44px"><div class="stack g20">'+
 '<div class="stack g12" style="align-items:center;padding-top:6px"><div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center"><div style="position:absolute;inset:0" class="spin">'+ring(96,24,T.ink)+'</div><div class="breathe">'+motif('diamond',T.ink,40,2,{heart:T.maroon,anim:false})+'</div></div><span class="micro">A pause, after '+S.pause.posts.length+' posts</span></div>'+
 (full?'<div class="card row g12" style="padding:12px"><div style="width:52px;height:64px;border-radius:12px;background:'+p.bg+';display:flex;align-items:center;justify-content:center;flex:none">'+motif(p.m,'#fff',40,3,{anim:false})+'</div><div class="stack g4" style="min-width:0"><b style="font-size:14px">'+esc(p.title)+'</b><span class="small">'+esc(p.who)+' · just now</span></div></div>':'<div class="notice">You’ve been scrolling for about 12 minutes.</div>')+
 '<div class="stack g8"><h1 class="q">'+QUESTIONS[S.q]+'</h1><button data-act="nextq" class="row g8" style="align-self:flex-start;height:40px;padding:0;border:none;background:none;font-size:14px;font-weight:600">'+I.refresh+'Ask me something else</button></div>'+
 '<label class="stack g6"><span class="micro">One word is enough</span><input id="word" class="word" maxlength="28" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="your word" value="'+esc(S.word)+'"></label>'+
 (S.nudge?'<div class="notice stack g10"><span>That doesn’t look like a word. No pressure: skipping takes the same 5 seconds, and it’s honest.</span><div class="row g8"><button class="chip" data-act="nudgeretry">Try a real word</button><button class="chip" data-act="skip">Skip instead</button></div></div>':'')+
 (S.more?'<div class="stack g8"><div class="row wrap g8">'+['It reminded me of','I noticed','I wish','Honestly,'].map(function(x){return '<button class="chip" data-starter="'+x+'">'+x+'…</button>'}).join('')+'</div><textarea id="thoughts" rows="3" placeholder="Only if you want to.">'+esc(S.text)+'</textarea></div>':'<div class="row g8"><button class="chip" data-act="more">+ Say a little more</button><button class="chip" data-act="voice">Speak instead</button></div>')+
 '</div><div class="stack g6" style="margin-top:16px"><button class="btn" id="cont" data-act="towheel" '+(S.word.trim().length>=2?'':'disabled')+'>Continue</button><button class="ghost" data-act="skip">'+(P.breath?'Not now · one breath':'Not now')+'</button><p class="small" style="text-align:center">Skipping is always quicker than pretending.</p></div></section>'}

function backoff(){return '<section class="screen between"><div class="stack g20"><div style="align-self:center;padding-top:16px">'+motif('frayed',T.slate,90,3,{})+'</div>'+
 '<h1 class="title" style="font-size:26px">Pauses haven’t been landing lately.</h1><p class="body">Your last few were skipped or rushed. That tells us something, not about you, about the pauses. What would make them worth it?</p>'+
 '<div class="stack g10">'+[['fewer','Fewer pauses','Every 15 posts, adaptive rhythm on.'],['tap','Just let me tap a feeling','No typing. One tap on the wheel.'],['dayoff','Take today off','No pauses until tomorrow.'],['keep','Keep things as they are','We’ll ask again in a while.']].map(function(o){return '<button class="choice" style="flex-direction:column;gap:4px" data-backoff="'+o[0]+'"><b style="font-size:16px">'+o[1]+'</b><span class="small">'+o[2]+'</span></button>'}).join('')+'</div>'+
 '</div></section>'}

function name(){var entry=null;WHEEL.forEach(function(w){if(w[0]===S.core)entry=w});var col=S.core?FEEL[S.core]:T.ink;
 var pos=[[118,4],[197,37],[230,116],[197,195],[118,228],[39,195],[6,116],[39,37]];
 return '<section class="screen between" style="padding-top:44px"><div class="stack g16">'+
 (P.tapOnly?'':'<button class="iconbtn" data-act="towrite" aria-label="Back to writing">'+I.back+'</button>')+
 '<div class="stack g6"><h1 class="title" style="font-size:26px">Want help naming it?</h1><p class="small">Only if it helps. Your words come first.</p></div>'+
 (S.word?'<p class="notice" style="font-weight:500;white-space:pre-line;word-break:break-word">“'+esc(S.word)+(S.text.trim()?' — '+esc(S.text.trim()):'')+'”</p>':'<p class="notice">Tap the feeling that fits. That’s the whole pause.</p>')+
 '<div style="position:relative;width:320px;height:276px;align-self:center;flex:none"><div style="position:absolute;left:40px;top:18px" class="spin">'+ring(240,32,T.warp)+'</div>'+
 '<div style="position:absolute;left:110px;top:88px;width:100px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center">'+(S.core?motif(motifFor({core:S.core}),col,56,S.level,{outline:S.worth===false}):'<span class="small" style="font-weight:600">How did<br>it feel?</span>')+'</div>'+
 WHEEL.map(function(w,i){var on=S.core===w[0];return '<button class="chip" style="position:absolute;left:'+pos[i][0]+'px;top:'+pos[i][1]+'px;width:84px;justify-content:center;padding:0;'+(on?'background:'+FEEL[w[0]]+';border-color:'+FEEL[w[0]]+';color:#fff':'')+'" data-core="'+w[0]+'" '+ap(on)+'>'+w[0]+'</button>'}).join('')+'</div>'+
 (S.core?(function(){var m=MEANING[SHAPE[S.core]];return '<div class="card dotted row g12" style="padding:12px 14px">'+motif(SHAPE[S.core],col,44,4,{})+'<span class="small"><b>'+m.name+', '+m.en+'.</b> '+m.why+'</span></div>'})():'')+
 '<div class="row wrap g8" style="justify-content:center"><button class="chip" data-core="Mixed" '+ap(S.core==='Mixed')+'><span class="sw" style="background:'+T.maroon+'"></span>Mixed</button><button class="chip" data-act="nofeel">I can’t tell</button></div>'+
 (entry?'<div class="stack g8"><span class="micro">Closer to</span><div class="row wrap g8">'+entry[1].map(function(n){return '<button class="chip" data-nuance="'+n+'" '+ap(S.nuance===n)+'>'+n+'</button>'}).join('')+'</div></div>':'')+
 (S.core?'<div class="stack g8"><span class="micro">How strongly</span><div class="row g10">'+[1,2,3,4,5].map(function(n){var on=n<=S.level;return '<button data-level="'+n+'" aria-label="Strength '+n+' of 5" '+ap(n===S.level)+' style="width:44px;height:44px;border-radius:22px;border:none;background:none;display:flex;align-items:center;justify-content:center"><span style="width:'+(10+n*3)+'px;height:'+(10+n*3)+'px;border-radius:50%;background:'+(on?col:'#fff')+';border:1.5px solid '+(on?col:'#BDB8B0')+';transition:all .15s"></span></button>'}).join('')+'</div></div>':'')+
 '<div class="stack g8"><span class="micro">Worth my time?</span><div class="row g8"><button class="chip" data-worth="yes" '+ap(S.worth===true)+'>Yes</button><button class="chip" data-worth="no" '+ap(S.worth===false)+'>No</button><button class="chip" data-worth="unsure" '+ap(S.worth==='unsure')+'>Not sure</button></div></div>'+
 '</div><div style="margin-top:18px"><button class="btn" data-act="save">Tie the knot</button></div></section>'}

function done(){var e=S.lastSaved,skipped=!e||e.skip,frayed=e&&e.frayed,wait=(skipped||frayed)&&P.breath;
 var title=skipped?'Skipped, and that’s okay.':frayed?'A loose thread.':'A knot in your weave.';
 var body=skipped?'An empty knot marks the pause anyway. Noticing you didn’t want to look is noticing too.':frayed?'That one didn’t hold, and that’s okay. It’s woven in as a loose thread, so your weave stays honest.':'Bigger means you felt it more. Breathe with the circle, then go back, or don’t.';
 return '<section class="screen between"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center">'+
 '<div style="position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center"><div style="position:absolute;inset:0" class="breathe">'+ring(200,36,T.ink)+'</div>'+knotFor(e||{skip:true},skipped?90:110,{})+'</div>'+
 '<div class="stack g10" style="align-items:center"><h1 class="title" style="font-size:26px">'+title+'</h1>'+(e&&!skipped&&!frayed?(function(){var m=meaningFor(e);return '<p class="body" style="max-width:300px"><b>'+m.name+', '+m.en+'.</b> '+m.why+'</p>'})():'')+'<p class="small" style="max-width:290px">'+body+'</p></div>'+
 '</div><div class="stack g6"><button class="btn" id="backfeed" data-act="backtofeed" '+(wait?'disabled':'')+'>'+(wait?'Breathe… 5':'Back to the feed')+'</button><button class="ghost" data-act="endsession">I’m done scrolling for now</button></div></section>'}

function crisis(){return '<section class="screen between"><div class="stack g20">'+
 '<div style="align-self:center;padding-top:10px" class="breathe">'+motif('ladwa',T.maroon,90,3,{})+'</div>'+
 '<h1 class="title" style="font-size:26px;text-align:center">That sounds really heavy.</h1>'+
 '<p class="body" style="text-align:center">You don’t have to carry it alone. Afterthought isn’t a counsellor, but people trained to help are available right now, free and confidential.</p>'+
 '<a class="btn" href="tel:14416" style="text-decoration:none">'+I.phone+'Call Tele-MANAS · 14416</a>'+
 '<div class="notice small">Tele-MANAS is India’s free, 24×7 national mental health helpline, in many languages. If you are in immediate danger, call <a href="tel:112"><b>112</b></a>.</div>'+
 '<p class="small" style="text-align:center">Your words were saved privately. Nobody else has been told.</p>'+
 '</div><div class="stack g6"><button class="btn light" data-act="crisisok">Go to my journal</button><button class="ghost" data-act="endsession">Close the feed for now</button></div></section>'}

/* ---------- pause: recall ---------- */
function recall(){var truth=S.pause.posts.map(function(p){return p.id}),n=truth.length,full=P.perm==='full';
 var slots='';for(var i=0;i<n;i++){var id=S.placed[i],p=id?byId(id):null,v='',vc=T.ink;
  if(S.checked&&!full){v=''}else if(S.checked){if(!p){v='Was: '+short(byId(truth[i]).title);vc='#BDB8B0'}else if(truth.indexOf(id)<0){v='Not in your feed';vc=T.red}else if(truth[i]===id){v='In order';vc=T.leaf}else{v='Was #'+(truth.indexOf(id)+1);vc=T.maroon}}
  slots+='<li class="row g10"><span style="width:22px;font-weight:700;text-align:center">'+(i+1)+'</span><button class="slot'+(p?' filled':'')+'" data-slot="'+i+'" '+(S.checked||!p?'disabled':'')+' aria-label="'+(p?'Remove '+esc(p.title):'Slot '+(i+1)+' empty')+'"><span>'+(p?esc(short(p.title)):(S.checked?'':'Empty'))+'</span>'+(v?'<span class="verdict" style="display:flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:4px;background:'+vc+';display:inline-block;flex:none"></i>'+v+'</span>':'')+'</button></li>'}
 var pool=S.pool.filter(function(p){return S.placed.indexOf(p.id)<0}).map(function(p){return '<button class="chip" data-place="'+p.id+'"><span class="sw" style="background:'+p.bg+'"></span>'+esc(short(p.title))+'</button>'}).join('');
 var res='';if(S.checked&&!full){res='<div class="card dotted stack g10"><p class="body">In Light mode Afterthought never sees your feed, so it can’t check. Just notice: how sure did you feel about each one?</p><p class="h2" style="font-size:18px;">What made the ones you remembered stick?</p></div>'}else if(S.checked){var inOrder=0,real=0,fake=0;S.placed.forEach(function(id,i){if(truth[i]===id)inOrder++;if(truth.indexOf(id)>=0)real++;else fake++});var miss=truth.filter(function(id){return S.placed.indexOf(id)<0}).map(function(id){return '“'+byId(id).title+'”'});
  res='<div class="card dotted stack g10"><p class="body">You remembered <b>'+real+' of '+n+'</b>'+(full?', '+inOrder+' in order':'')+'.'+(fake?' You also “remembered” '+fake+' post'+(fake>1?'s':'')+' you never saw.':'')+(miss.length?' Slipped away: '+esc(miss.join(', '))+'.':'')+'</p><p class="h2" style="font-size:18px;">Why do you think those ones stayed with you?</p></div>'}
 return '<section class="screen between" style="padding-top:44px"><div class="stack g16">'+
 '<div class="spread"><span class="micro">Recall · '+n+' posts</span><span class="small">'+(full?'Checked against your feed':'Self check, memory only')+'</span></div>'+
 '<h1 class="title" style="font-size:26px">'+(S.checked?'Here’s what you actually saw.':'What did you just see, in order?')+'</h1>'+
 (S.checked?'':'<p class="small">Two of these you never saw. Leave a slot empty if you’re not sure.</p>')+
 '<ol class="stack g8" style="margin:0;padding:0;list-style:none">'+slots+'</ol>'+
 (!S.checked?'<div class="row wrap g8">'+pool+'</div>':res)+
 '</div><div class="stack g6" style="margin-top:16px">'+(!S.checked?'<button class="btn" data-act="check" '+(S.placed.length?'':'disabled')+'>Check</button><button class="ghost" data-act="skip">Not now</button>':'<button class="btn" data-act="recallwrite">Write about it</button><button class="ghost" data-act="recalldone">Back to the feed</button>')+'</div></section>'}
function byId(id){return POSTS.filter(function(p){return p.id===id})[0]}
function short(s){return s.length>30?s.slice(0,28)+'…':s}

/* ---------- journal ---------- */
function journal(){var f=S.filter,list=written().filter(function(e){return !e.frayed}).filter(function(e){return f==='all'||(f==='heavy'&&HEAVY.indexOf(e.core)>=0)||(f==='worth'&&e.worth===true)});
 return '<div class="screen" style="padding-bottom:20px"><div class="stack g16"><div class="spread"><h1 class="title">Journal</h1><span class="small">'+written().length+' entries</span></div>'+daanaRow(342,{anim:true})+
 '<div class="row g8" role="group" aria-label="Filter">'+[['all','All'],['heavy','Felt heavy'],['worth','Worth it']].map(function(o){return '<button class="chip" data-filter="'+o[0]+'" '+ap(f===o[0])+'>'+o[1]+'</button>'}).join('')+'</div>'+
 (list.length?list.map(function(e){var col=e.core?FEEL[e.core]:T.ink;return '<article class="entry"><div style="flex:none">'+knotFor(e,48,{anim:false})+'</div><div class="stack g8" style="min-width:0;flex:1"><div class="spread small"><span>'+when(e.t)+'</span><span>'+esc(e.source)+'</span></div>'+(e.post?'<b style="font-size:13px">'+esc(e.post)+'</b>':'')+(e.words?'<p class="words">“'+esc(e.words)+'”</p>':'')+'<div class="spread">'+(e.core?'<span class="pill"><i style="background:'+col+'"></i>'+(e.nuance?esc(e.nuance)+' · ':'')+e.core.toLowerCase()+' · '+meaningFor(e).name.toLowerCase()+'</span>':'<span class="pill">unnamed</span>')+'<button class="chip" style="min-height:36px;padding:0 12px;font-size:12px" data-del="'+e.id+'" aria-label="Delete entry">Delete</button></div>'+(e.sample?'<span class="small" style="font-style:italic">Sample entry</span>':'')+'</div></article>'}).join(''):'<div class="notice">Nothing here yet. Your entries will appear as you pause.</div>')+
 '</div></div>'+tabs('journal')}

/* ---------- weave + weekly letter ---------- */
function weavePage(){var es=P.entries,wr=written().filter(function(e){return !e.frayed}),counts={};wr.forEach(function(e){if(e.core)counts[e.core]=(counts[e.core]||0)+1});
 var top=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]});var heavy=wr.filter(function(e){return HEAVY.indexOf(e.core)>=0}).length,worth=wr.filter(function(e){return e.worth===true}).length,skips=P.entries.filter(function(e){return e.skip}).length,frayed=P.entries.filter(function(e){return e.frayed}).length;
 var np=P.entries.length+P.pauses,pl=function(n,w){return n+' '+w+(n===1?'':'s')};
 var quote=wr.filter(function(e){return e.words&&e.words.length>12}).sort(function(a,b){return b.t-a.t})[0];
 var intentLine=(P.intentions[0]||'notice how your feed makes you feel').toLowerCase();
 var letter='This week you paused '+(np===1?'once':np+' times')+' and wrote '+(wr.length===1?'once':wr.length+' times')+'.'+(top[0]?' The feeling that came up most was '+top[0].toLowerCase()+'.':'')+(wr.length?' You marked '+worth+' of '+pl(wr.length,'post')+' as worth your time.':'')+' You came here to '+intentLine+'.';
 var opts=[['nothing','Nothing for now','Noted. Seeing the pattern is the point.'],['write','Write about the week','A blank page is waiting.'],['quiet','Pause the heavy accounts for a week','Done. You can undo this in Settings.']];var sel=opts.filter(function(o){return o[0]===S.choice})[0];
 return '<div class="screen" style="padding-bottom:20px"><div class="stack g20"><div class="spread" style="align-items:flex-end"><div class="stack g6"><span class="micro">This week</span><h1 class="title">Your weave</h1></div><button class="chip" data-go="legend">How to read it</button></div>'+
 '<div class="card dotted" style="padding:16px;display:flex;justify-content:center">'+weave(es,310,{anim:true,next:true,today:true})+'</div>'+
 '<div class="row wrap g8">'+Object.keys(FEEL).filter(function(k){return counts[k]}).map(function(k){return '<span class="pill"><i style="background:'+FEEL[k]+'"></i>'+k+' '+counts[k]+'</span>'}).join('')+(skips?'<span class="pill"><i style="background:#fff;border:1px dashed #111"></i>Skipped '+skips+'</span>':'')+(frayed?'<span class="pill"><i style="background:'+T.slate+'"></i>Loose threads '+frayed+'</span>':'')+'</div>'+
 '<div class="card stack g12" style="border-color:#111"><span class="micro" style="display:flex;align-items:center;gap:8px"><i style="width:8px;height:8px;border-radius:4px;background:'+T.maroon+';display:inline-block"></i>A letter from your week</span><p class="body">'+esc(letter)+'</p>'+(quote?'<p class="body" style="font-weight:600">One thing you wrote: “'+esc(quote.words)+'”</p>':'')+(heavy?'<p class="h2" style="font-size:18px">'+heavy+' of your entries felt heavy. What would you like to do with that?</p><div class="stack g8">'+opts.map(function(o){return '<button class="choice" style="padding:14px 16px;font-size:15px;font-weight:500" data-choice="'+o[0]+'" '+ap(S.choice===o[0])+'>'+o[1]+'</button>'}).join('')+'</div>'+(sel?'<p class="small" style="font-weight:600">'+sel[2]+'</p>':''):'')+'</div>'+
 '<button class="btn light" data-act="share">Share my weave (no words included)</button>'+
 '</div></div>'+tabs('weave')}

function legend(){var L=function(svg,name,desc){return '<div class="legend-row" style="align-items:flex-start"><div style="width:60px;flex:none;display:flex;justify-content:center">'+svg+'</div><div class="stack g4"><b style="font-size:15px">'+name+'</b><span class="small">'+desc+'</span></div></div>'};
 var dict=['mor','ambo','chakalo','teer','khajuri','morpag','naughara','chopad'].map(function(k){var m=MEANING[k];return L(motif(k,FEEL[m.feel],56,4,{anim:false}),m.feel+' · '+m.name+', '+m.en,m.why)}).join('')+
  ['row','knot','hollow','frayed'].map(function(k){var m=MEANING[k];return L(motif(k,k==='knot'||k==='hollow'?T.ink:T.slate,52,3,{anim:false}),m.feel+' · '+m.name,m.why)}).join('');
 return '<div class="screen" style="padding-bottom:28px"><div class="stack g16">'+head('weave','Weave guide')+'<h1 class="title">How to read your weave</h1><p class="body">Every knot is one pause. Its shape is the feeling, its size how strong it was.</p>'+
 '<div class="stack"><span class="micro" style="margin:6px 0">Feeling · motif · why</span>'+dict+'</div>'+
 '<div class="stack"><span class="micro" style="margin:12px 0 6px">The other threads</span>'+
 L('<div class="row g4">'+['Joy','Calm','Fear','Sadness','Anger'].map(function(k){return '<span style="width:9px;height:9px;border-radius:5px;background:'+FEEL[k]+'"></span>'}).join('')+'</div>','Colour','Each feeling has its own thread colour.')+
 L('<div class="row g4" style="align-items:center">'+motif('ambo',T.leaf,24,1,{anim:false})+motif('ambo',T.leaf,40,5,{anim:false})+'</div>','Size','How strongly you felt it, 1 to 5.')+
 L('<div class="row g4">'+motif('ambo',T.leaf,28,4,{anim:false})+motif('ambo',T.leaf,28,4,{anim:false,outline:true})+'</div>','Solid or outline','Solid: worth my time. Outline: it wasn’t.')+
 L('<svg width="52" height="14" aria-hidden="true"><line x1="0" x2="52" y1="7" y2="7" stroke="'+T.maroon+'" stroke-width="2"/></svg>','Maroon line','The end of a day, after the maroon bands of Ramraj tangaliya.')+
 L('<svg width="52" height="30" aria-hidden="true">'+[4,12,20,28,36,44].map(function(x){return '<line x1="'+x+'" x2="'+x+'" y1="2" y2="28" stroke="#D9D4CC" stroke-width="1.2"/>'}).join('')+'</svg>','Grey warp','One thread for every 5 posts you scrolled. Knots are tied where you paused, the way daana is twisted onto the warp.')+'</div>'+
 '<div class="notice stack g6"><b>Why a weave?</b><span class="small">In Tangaliya, a handloom weave from Gujarat, every dot (daana) is tied by hand, so the weaver has to stop. Here, every pause ties one.</span></div>'+
 '</div></div>'}

/* ---------- settings ---------- */
function settings(){return '<div class="screen" style="padding-bottom:20px"><div class="stack g16"><h1 class="title">Settings</h1>'+
